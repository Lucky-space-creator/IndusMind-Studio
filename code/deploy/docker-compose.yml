name: hwc

services:
  mysql:
    image: mysql:8.0
    container_name: hwc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hwc123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hwc}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - hwc-mysql-data:/var/lib/mysql
      # 初始化脚本按文件名序执行：V1 建表 → V2 初始化 → V3 演示数据
      - ../backend/sql/mysql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-hwc123456}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hwc-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - hwc-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: hwc-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hwcadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hwc123456}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - hwc-minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres:
    # pgvector 官方镜像（PostgreSQL 16 + vector 扩展），Python AI 服务专用
    image: pgvector/pgvector:pg16
    container_name: hwc-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hwc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hwc123456}
      POSTGRES_DB: ${POSTGRES_DB:-hwc_ai}
      TZ: Asia/Shanghai
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hwc-pg-data:/var/lib/postgresql/data
      - ../ai-service/sql/postgresql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hwc}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5-community
    container_name: hwc-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-hwc123456}
      TZ: Asia/Shanghai
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - hwc-neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  hwc-mysql-data:
  hwc-redis-data:
  hwc-minio-data:
  hwc-pg-data:
  hwc-neo4j-data: