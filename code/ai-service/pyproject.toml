[project]
name = "hwc-ai-service"
version = "1.0.0"
description = "工业设备巡检与运维智能系统 - AI 服务（RAG / GraphRAG / Agent）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "neo4j>=5.19",
    "redis>=5.0",
    "langchain>=0.2,<0.4",
    "langgraph>=0.2,<0.4",
    "langchain-community>=0.2,<0.4",
    "langchain-openai>=0.1",
    "openai>=1.30",
]

[project.optional-dependencies]
dashscope = ["dashscope>=1.20"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]